          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_NOT_FOUND:
                  value:
                    statusCode: 404
                    code: PRODUCT_NOT_FOUND
                    message: Không tìm thấy sản phẩm.
                INVENTORY_NOT_FOUND:
                  value:
                    statusCode: 404
                    code: INVENTORY_NOT_FOUND
                    message: Không tìm thấy dòng tồn kho.
        '409':
          description: Lỗi 409; xử lý theo code.
          content:
            application/json:
              schema:
