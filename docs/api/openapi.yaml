                    payment:
                      id: 55555555-5555-4555-8555-555555555555
                      orderId: 22222222-2222-4222-8222-222222222222
                      transactionRef: MOCK-DEMO-001
                      amount: '285000.00'
                      currency: VND
                      method: MOCK_CARD
                      status: FAILED
                      failureReason: MOCK_DECLINED
                      callbackCount: 1
                      processedAt: '2026-10-09T03:03:00Z'
                      createdAt: '2026-10-09T03:01:00Z'
                      updatedAt: '2026-10-09T03:03:00Z'
                    orderStatus: PENDING_PAYMENT
                    duplicate: false
                duplicate:
                  value:
                    payment:
                      id: 55555555-5555-4555-8555-555555555555
                      orderId: 22222222-2222-4222-8222-222222222222
                      transactionRef: MOCK-DEMO-001
                      amount: '285000.00'
                      currency: VND
                      method: MOCK_CARD
                      status: SUCCESS
                      failureReason: null
                      callbackCount: 2
                      processedAt: '2026-10-09T03:03:00Z'
                      createdAt: '2026-10-09T03:01:00Z'
                      updatedAt: '2026-10-09T03:04:00Z'
                    orderStatus: CONFIRMED
                    duplicate: true
        '401':
          description: Lỗi 401; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_CALLBACK_TOKEN:
                  value:
                    statusCode: 401
                    code: INVALID_CALLBACK_TOKEN
                    message: Không xác thực được mock callback.
        '400':
          description: Lỗi 400; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  value:
                    statusCode: 400
