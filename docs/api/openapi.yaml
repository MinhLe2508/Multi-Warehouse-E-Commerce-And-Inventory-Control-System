# DRAFT FOR TEAM REVIEW — Huy, tuần 1. Không phải API đã triển khai.
openapi: 3.0.3
info:
  title: Multi-Warehouse — Orders, Payments & Stock Reservation contract
  version: 0.1.1
  description: Bản dự thảo hoàn chỉnh để nhóm review nhiệm vụ tuần 1 của Huy. Đối chiếu ZIP nhánh project, commit 2cc0677fd6fd1a0253f400a71a2f71d1d01ff505.
    Chưa có Orders/Payments controllers, Auth hoặc mock gateway chạy thật. Các endpoint, error envelope, chọn kho và
    quy tắc retry là ĐỀ XUẤT, không phải xác nhận triển khai/phê duyệt. Hàm fn_reserve_stock và enum/model được lấy từ
    source. Xem README.md, stock-reservation-contract.md và week1-decisions.md. Example IDs/time là giả lập, không phải
    dữ liệu seed. JSON camelCase, money/BIGINT dạng chuỗi. Không nhận field ngoài schema.
servers:
- url: http://localhost:3001
  description: Địa chỉ phát triển dự kiến; API contract chưa được triển khai ở bản ZIP nền.
tags:
- name: Orders
  description: API CUSTOMER cho đơn hàng của chính mình.
- name: Payments
  description: Thanh toán mock, tra cứu và callback nội bộ.
paths:
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Tạo đơn và giữ hàng trong một transaction
      description: 'CẬP NHẬT NHÓM 09/10: Auth phải xác nhận tài khoản được phép hoạt động và đã hoàn tất đổi mật khẩu
        lần đầu. Token chỉ dành cho đổi mật khẩu chưa được truy cập route này (403 PASSWORD_CHANGE_REQUIRED); tài khoản
        không hoạt động trả 403 ACCOUNT_INACTIVE. Guard phía server kiểm tra trước truy vấn nghiệp vụ; frontend redirect
        không thay thế guard. Các mã lỗi và tên thuộc tính auth context là đề xuất tích hợp, chưa có trong source ZIP.
        DỰ THẢO, chưa có controller. CUSTOMER. Kiểm tra sản phẩm active; client không gửi giá/userId/TTL. Tối đa 50 productId
        khác nhau, 1..100 mỗi sản phẩm. Đề xuất chọn kho active: ưu tiên region khớp shippingRegion đã trim, sau đó warehouse.code
        tăng dần và inventory.id tăng dần; phân bổ tham lam, có thể tách một sản phẩm qua nhiều kho. Gọi fn_reserve_stock
        theo inventory.id tăng dần toàn đơn trong cùng transaction; cạnh tranh thiếu hàng thì rollback toàn bộ và 409.
        Giá snapshot tính Decimal, làm tròn HALF_UP 2 số cho giảm giá từng dòng; phí giao hàng đề xuất 0 VND. Trả 201
        sau commit. Không có idempotency key trong schema hiện tại: gửi POST mới có thể tạo đơn mới; không tự retry khi
        timeout, tra danh sách đơn trước.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              normal:
                value:
                  items:
                  - productId: 11111111-1111-4111-8111-111111111111
                    quantity: 2
                  shippingRecipient: Khách demo
                  shippingPhone: 0900000000
                  shippingAddress: Địa chỉ demo tại TP.HCM
                  shippingRegion: Miền Nam
      responses:
        '201':
          description: Đã commit đơn và toàn bộ giữ chỗ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
              examples:
                holding:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    orderCode: ORD-DEMO-001
                    status: PENDING_PAYMENT
                    grandTotal: '285000.00'
                    currency: VND
                    reservationExpiresAt: '2026-10-09T03:15:00Z'
                    createdAt: '2026-10-09T03:00:00Z'
                    updatedAt: '2026-10-09T03:00:00Z'
                    subtotal: '300000.00'
                    discountTotal: '15000.00'
                    shippingFee: '0.00'
                    shippingRecipient: Khách demo
                    shippingPhone: 0900000000
                    shippingAddress: Địa chỉ demo tại TP.HCM
                    shippingRegion: Miền Nam
                    cancelledReason: null
                    confirmedAt: null
                    cancelledAt: null
                    items:
                    - id: 44444444-4444-4444-8444-444444444444
                      productId: 11111111-1111-4111-8111-111111111111
                      warehouseId: 33333333-3333-4333-8333-333333333333
                      productName: Tai nghe demo
                      sku: DEMO-001
                      quantity: 2
                      unitPrice: '150000.00'
                      discountAmount: '15000.00'
                      lineTotal: '285000.00'
        '401':
          description: Lỗi 401; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHORIZED:
                  value:
                    statusCode: 401
                    code: UNAUTHORIZED
                    message: Cần đăng nhập bằng token hợp lệ.
        '403':
          description: Lỗi 403; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  value:
                    statusCode: 403
                    code: FORBIDDEN
                    message: Vai trò không được phép thực hiện thao tác này.
                PASSWORD_CHANGE_REQUIRED:
                  value:
                    statusCode: 403
                    code: PASSWORD_CHANGE_REQUIRED
                    message: Bạn cần đổi mật khẩu lần đầu trước khi sử dụng chức năng này.
                ACCOUNT_INACTIVE:
                  value:
                    statusCode: 403
                    code: ACCOUNT_INACTIVE
                    message: Tài khoản hiện không được phép sử dụng hệ thống.
        '500':
          description: Lỗi 500; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  value:
                    statusCode: 500
                    code: INTERNAL_ERROR
                    message: Không thể xử lý yêu cầu, vui lòng kiểm tra lại trạng thái trước khi gửi lại.
        '400':
          description: Lỗi 400; xử lý theo code.
