components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'CUSTOMER, tài khoản hoạt động và đã đổi mật khẩu lần đầu theo cập nhật nhóm 09/10. Bearer token riêng
        lẻ không chứng minh đã hoàn tất bước này: guard phải xác minh trạng thái do Auth quản lý. Chưa có Auth code trong
        ZIP nền.'
    mockCallbackToken:
      type: apiKey
      in: header
      name: X-Mock-Callback-Token
      description: ĐỀ XUẤT secret riêng phía server/local test, chưa có cấu hình source. Không đưa token này vào frontend;
        khi thiếu cấu hình thì endpoint phải đóng.
  schemas:
    Uuid:
      type: string
      format: uuid
    BigIntId:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      maxLength: 19
      description: ID PostgreSQL BIGINT dương, serialize thành chuỗi. Tầng service kiểm tra <= 9223372036854775807; không
        chuyển sang Number.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      maxLength: 15
      description: Chuỗi Decimal(14,2) không âm; tối đa 12 chữ số phần nguyên và đúng 2 chữ số thập phân.
    PositiveMoney:
      type: string
      pattern: ^([1-9][0-9]{0,11}\.[0-9]{2}|0\.(0[1-9]|[1-9][0-9]))$
      maxLength: 15
      description: Tiền > 0, tương ứng CHECK payments.amount > 0.
    Currency:
      type: string
      enum:
      - VND
      description: 'Đề xuất 0.1: chỉ VND. CSDL CHAR(3) có thể mở rộng sau review.'
    OrderStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - SHIPPING
      - DELIVERED
      - CANCELLED
    ReservationStatus:
      type: string
      enum:
      - HOLDING
      - COMMITTED
      - RELEASED
      - EXPIRED
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
    PaymentMethod:
      type: string
      enum:
      - MOCK_CARD
      - MOCK_EWALLET
      - COD
      description: Đúng enum DB. Đề xuất 0.1 chỉ thực hiện hai phương thức MOCK; yêu cầu COD trả 422 UNSUPPORTED_PAYMENT_METHOD.
    ShippingRecipient:
      type: string
      minLength: 1
      maxLength: 150
      description: Trim trước khi kiểm tra; không chấp nhận toàn khoảng trắng.
    ShippingPhone:
      type: string
      minLength: 9
      maxLength: 20
      pattern: ^\+?[0-9]{9,15}$
      description: Đề xuất format số điện thoại cho bản 0.1.
    ShippingAddress:
      type: string
      minLength: 1
      maxLength: 500
      description: Trim trước khi kiểm tra; không chấp nhận toàn khoảng trắng.
    CreateOrderItem:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId:
