                    orderId: 22222222-2222-4222-8222-222222222222
                    transactionRef: MOCK-DEMO-001
                    amount: '285000.00'
                    currency: VND
                    method: MOCK_CARD
                    status: PENDING
                    failureReason: null
                    callbackCount: 0
                    processedAt: null
                    createdAt: '2026-10-09T03:01:00Z'
                    updatedAt: '2026-10-09T03:01:00Z'
        '401':
          description: Lỗi 401; xử lý theo code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHORIZED:
                  value:
                    statusCode: 401
                    code: UNAUTHORIZED
