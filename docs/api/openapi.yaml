openapi: 3.0.3
info:
  title: Multi-Warehouse Customer API
  version: 1.0.0
  description: Đặt hàng, xem đơn của chính mình và thanh toán mô phỏng.
servers:
- url: http://localhost:3001
security:
- bearerAuth: []
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Tạo đơn và giữ chỗ tồn kho
      tags:
      - Orders
      description: Khách hàng hoàn tất đổi mật khẩu lần đầu. Các productId trong đơn phải khác nhau. Backend tính
        tiền, chọn kho và giữ tồn kho trong giao dịch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              normal:
                value:
                  items:
                  - productId: 22222222-2222-4222-8222-222222222222
                    quantity: 2
                  shippingRecipient: Khách demo
                  shippingPhone: 0900000000
                  shippingAddress: 1 Đường thử nghiệm
                  shippingRegion: Miền Nam
      responses:
        '201':
          description: Đã tạo đơn chờ thanh toán.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                pending:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    orderCode: ORD-DEMO20261119
                    userId: 33333333-3333-4333-8333-333333333333
                    status: PENDING_PAYMENT
                    subtotal: '100000.00'
                    discountTotal: '0.00'
                    shippingFee: '0.00'
                    grandTotal: '100000.00'
                    currency: VND
                    shippingRecipient: Khách demo
                    shippingPhone: 0900000000
                    shippingAddress: 1 Đường thử nghiệm
                    shippingRegion: Miền Nam
                    reservationExpiresAt: '2026-11-19T05:15:00Z'
                    cancelledReason: null
                    cancelledAt: null
                    confirmedAt: null
                    createdAt: '2026-11-19T05:00:00Z'
                    updatedAt: '2026-11-19T05:00:00Z'
                    items:
                    - id: 55555555-5555-4555-8555-555555555555
                      orderId: 11111111-1111-4111-8111-111111111111
                      productId: 22222222-2222-4222-8222-222222222222
                      warehouseId: 44444444-4444-4444-8444-444444444444
                      inventoryId: '9007199254740993'
                      productName: Sản phẩm demo
                      sku: DEMO-1
                      unitPrice: '50000.00'
                      discountAmount: '0.00'
                      quantity: 2
                      lineTotal: '100000.00'
                      createdAt: '2026-11-19T05:00:00Z'
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    statusCode: 400
                    error: Bad Request
                    code: VALIDATION_ERROR
                    message:
                    - Dữ liệu không hợp lệ.
                    path: /orders
                    timestamp: '2026-11-19T05:00:07Z'
        '401':
          description: Phiên đăng nhập chưa hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    code: UNAUTHORIZED
                    message: Cần đăng nhập.
                    path: /orders
                    timestamp: '2026-11-19T05:00:07Z'
        '403':
          description: Thiếu quyền hoặc cần đổi mật khẩu lần đầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                passwordChange:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: PASSWORD_CHANGE_REQUIRED
                    message: Vui lòng đổi mật khẩu lần đầu.
                    path: /orders
                    timestamp: '2026-11-19T05:00:07Z'
                role:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: FORBIDDEN
                    message: Bạn không có quyền thực hiện thao tác.
                    path: /orders
                    timestamp: '2026-11-19T05:00:07Z'
        '409':
          description: Hết hàng khả dụng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outOfStock:
                  value:
                    statusCode: 409
                    error: Conflict
                    code: INSUFFICIENT_STOCK
                    message: INSUFFICIENT_STOCK
                    path: /orders
                    timestamp: '2026-11-19T05:00:07Z'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Đọc đơn và lịch sử trạng thái
      tags:
      - Orders
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Chi tiết đơn thuộc khách đã đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
              examples:
                pending:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    orderCode: ORD-DEMO20261119
                    userId: 33333333-3333-4333-8333-333333333333
                    status: PENDING_PAYMENT
                    subtotal: '100000.00'
                    discountTotal: '0.00'
                    shippingFee: '0.00'
                    grandTotal: '100000.00'
                    currency: VND
                    shippingRecipient: Khách demo
                    shippingPhone: 0900000000
                    shippingAddress: 1 Đường thử nghiệm
                    shippingRegion: Miền Nam
                    reservationExpiresAt: '2026-11-19T05:15:00Z'
                    cancelledReason: null
                    cancelledAt: null
                    confirmedAt: null
                    createdAt: '2026-11-19T05:00:00Z'
                    updatedAt: '2026-11-19T05:00:00Z'
                    items:
                    - id: 55555555-5555-4555-8555-555555555555
                      orderId: 11111111-1111-4111-8111-111111111111
                      productId: 22222222-2222-4222-8222-222222222222
                      warehouseId: 44444444-4444-4444-8444-444444444444
                      inventoryId: '9007199254740993'
                      productName: Sản phẩm demo
                      sku: DEMO-1
                      unitPrice: '50000.00'
                      discountAmount: '0.00'
                      quantity: 2
                      lineTotal: '100000.00'
                      createdAt: '2026-11-19T05:00:00Z'
                    statusHistory:
                    - id: '10'
                      orderId: 11111111-1111-4111-8111-111111111111
                      fromStatus: null
                      toStatus: PENDING_PAYMENT
                      actorId: 33333333-3333-4333-8333-333333333333
                      reason: Tạo đơn và giữ chỗ tồn kho
                      createdAt: '2026-11-19T05:00:00Z'
                expired:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    orderCode: ORD-DEMO20261119
                    userId: 33333333-3333-4333-8333-333333333333
                    status: CANCELLED
                    subtotal: '100000.00'
                    discountTotal: '0.00'
                    shippingFee: '0.00'
                    grandTotal: '100000.00'
                    currency: VND
                    shippingRecipient: Khách demo
                    shippingPhone: 0900000000
                    shippingAddress: 1 Đường thử nghiệm
                    shippingRegion: Miền Nam
                    reservationExpiresAt: '2026-11-19T05:15:00Z'
                    cancelledReason: EXPIRED
                    cancelledAt: '2026-11-19T05:15:00Z'
                    confirmedAt: null
                    createdAt: '2026-11-19T05:00:00Z'
                    updatedAt: '2026-11-19T05:15:00Z'
                    items:
                    - id: 55555555-5555-4555-8555-555555555555
                      orderId: 11111111-1111-4111-8111-111111111111
                      productId: 22222222-2222-4222-8222-222222222222
                      warehouseId: 44444444-4444-4444-8444-444444444444
                      inventoryId: '9007199254740993'
                      productName: Sản phẩm demo
                      sku: DEMO-1
                      unitPrice: '50000.00'
                      discountAmount: '0.00'
                      quantity: 2
                      lineTotal: '100000.00'
                      createdAt: '2026-11-19T05:00:00Z'
                    statusHistory:
                    - id: '10'
                      orderId: 11111111-1111-4111-8111-111111111111
                      fromStatus: null
                      toStatus: PENDING_PAYMENT
                      actorId: 33333333-3333-4333-8333-333333333333
                      reason: Tạo đơn và giữ chỗ tồn kho
                      createdAt: '2026-11-19T05:00:00Z'
                    - id: '11'
                      orderId: 11111111-1111-4111-8111-111111111111
                      fromStatus: PENDING_PAYMENT
                      toStatus: CANCELLED
                      actorId: null
                      reason: EXPIRED
                      createdAt: '2026-11-19T05:15:00Z'
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    statusCode: 400
                    error: Bad Request
                    code: VALIDATION_ERROR
                    message:
                    - Dữ liệu không hợp lệ.
                    path: /orders/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '401':
          description: Phiên đăng nhập chưa hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    code: UNAUTHORIZED
                    message: Cần đăng nhập.
                    path: /orders/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '403':
          description: Thiếu quyền hoặc cần đổi mật khẩu lần đầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                passwordChange:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: PASSWORD_CHANGE_REQUIRED
                    message: Vui lòng đổi mật khẩu lần đầu.
                    path: /orders/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
                role:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: FORBIDDEN
                    message: Bạn không có quyền thực hiện thao tác.
                    path: /orders/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '404':
          description: Đơn không tồn tại trong tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 404
                    error: Not Found
                    code: NOT_FOUND
                    message: Không tìm thấy đơn hàng.
                    path: /orders/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
  /payments/mock/{orderId}:
    post:
      operationId: payMockOrder
      summary: Thử thanh toán mô phỏng trên đơn chờ
      tags:
      - Payments
      description: Thiết bị khách gửi kết quả mô phỏng. Đơn sử dụng số tiền do server lưu. Khi bị từ chối, khách
        có thể thử lại trên cùng đơn trước khi hết hạn. Gửi lại cùng giao dịch trả duplicate=true.
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
            examples:
              approved:
                value:
                  transactionRef: DEMO-MOCK-OK
                  method: MOCK_CARD
                  approved: true
              declined:
                value:
                  transactionRef: DEMO-MOCK-NO
                  method: MOCK_CARD
                  approved: false
      responses:
        '201':
          description: Kết quả lần xử lý hoặc xác nhận giao dịch đã ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockPaymentResult'
              examples:
                success:
                  value:
                    transactionRef: DEMO-MOCK-OK
                    status: SUCCESS
                    orderStatus: CONFIRMED
                    duplicate: false
                declined:
                  value:
                    transactionRef: DEMO-MOCK-NO
                    status: FAILED
                    orderStatus: PENDING_PAYMENT
                    duplicate: false
                repeat:
                  value:
                    transactionRef: DEMO-MOCK-OK
                    status: SUCCESS
                    orderStatus: CONFIRMED
                    duplicate: true
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    statusCode: 400
                    error: Bad Request
                    code: VALIDATION_ERROR
                    message:
                    - Dữ liệu không hợp lệ.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '401':
          description: Phiên đăng nhập chưa hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    code: UNAUTHORIZED
                    message: Cần đăng nhập.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '403':
          description: Thiếu quyền hoặc cần đổi mật khẩu lần đầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                passwordChange:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: PASSWORD_CHANGE_REQUIRED
                    message: Vui lòng đổi mật khẩu lần đầu.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
                role:
                  value:
                    statusCode: 403
                    error: Forbidden
                    code: FORBIDDEN
                    message: Bạn không có quyền thực hiện thao tác.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '404':
          description: Đơn không tồn tại trong tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 404
                    error: Not Found
                    code: NOT_FOUND
                    message: Không tìm thấy đơn hàng.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
        '409':
          description: Đơn hết hạn, đã kết thúc hoặc có giao dịch xung đột.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  value:
                    statusCode: 409
                    error: Conflict
                    code: RESERVATION_EXPIRED
                    message: Giữ chỗ đã hết hạn.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
                conflict:
                  value:
                    statusCode: 409
                    error: Conflict
                    code: CONFLICT
                    message: transactionRef đã thuộc giao dịch khác.
                    path: /payments/mock/11111111-1111-4111-8111-111111111111
                    timestamp: '2026-11-19T05:00:07Z'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Uuid:
      type: string
      format: uuid
    BigIntId:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      maxLength: 19
      description: ID PostgreSQL BIGINT dương, serialize thành chuỗi. Tầng service kiểm tra <= 9223372036854775807;
        không chuyển sang Number.
    OrderStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - SHIPPING
      - DELIVERED
      - CANCELLED
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
    PaymentMethod:
      type: string
      enum:
      - MOCK_CARD
      - MOCK_EWALLET
      - COD
      - BANK_TRANSFER
      description: Đúng enum DB. Đề xuất 0.1 chỉ thực hiện hai phương thức MOCK; yêu cầu COD trả 422 UNSUPPORTED_PAYMENT_METHOD.
    ReservationStatus:
      type: string
      enum:
      - HOLDING
      - COMMITTED
      - RELEASED
      - EXPIRED
    ReservationInternal:
      type: object
      additionalProperties: false
      required:
      - id
      - orderId
      - orderItemId
      - inventoryId
      - quantity
      - status
      - expiresAt
      - committedAt
      - releasedAt
      properties:
        id:
          $ref: '#/components/schemas/BigIntId'
        orderId:
          $ref: '#/components/schemas/Uuid'
        orderItemId:
          type: string
          format: uuid
          nullable: true
        inventoryId:
          $ref: '#/components/schemas/BigIntId'
        quantity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
      description: Mô hình JSON tham chiếu nội bộ; không có endpoint công khai. SQL chỉ trả BIGINT id; service phải
        đọc row nếu cần các field khác.
    Money:
      type: string
      pattern: ^[0-9]{1,12}\.[0-9]{2}$
    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                $ref: '#/components/schemas/Uuid'
              quantity:
                type: integer
                minimum: 1
                maximum: 100
            required:
            - productId
            - quantity
            additionalProperties: false
          minItems: 1
          maxItems: 50
        shippingRecipient:
          type: string
          minLength: 1
          maxLength: 150
          pattern: \S
        shippingPhone:
          type: string
          pattern: ^\+?[0-9]{9,15}$
        shippingAddress:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        shippingRegion:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          pattern: \S
      required:
      - items
      - shippingRecipient
      - shippingPhone
      - shippingAddress
      additionalProperties: false
    OrderItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        orderId:
          $ref: '#/components/schemas/Uuid'
        productId:
          $ref: '#/components/schemas/Uuid'
        warehouseId:
          $ref: '#/components/schemas/Uuid'
        inventoryId:
          $ref: '#/components/schemas/BigIntId'
        productName:
          type: string
        sku:
          type: string
        unitPrice:
          $ref: '#/components/schemas/Money'
        discountAmount:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - orderId
      - productId
      - warehouseId
      - inventoryId
      - productName
      - sku
      - unitPrice
      - discountAmount
      - quantity
      - lineTotal
      - createdAt
      additionalProperties: false
    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        orderCode:
          type: string
          maxLength: 32
        userId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/OrderStatus'
        subtotal:
          $ref: '#/components/schemas/Money'
        discountTotal:
          $ref: '#/components/schemas/Money'
        shippingFee:
          $ref: '#/components/schemas/Money'
        grandTotal:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        shippingRecipient:
          type: string
        shippingPhone:
          type: string
        shippingAddress:
          type: string
        shippingRegion:
          type: string
          nullable: true
        reservationExpiresAt:
          type: string
          format: date-time
          nullable: true
        cancelledReason:
          type: string
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - orderCode
      - userId
      - status
      - subtotal
      - discountTotal
      - shippingFee
      - grandTotal
      - currency
      - shippingRecipient
      - shippingPhone
      - shippingAddress
      - shippingRegion
      - reservationExpiresAt
      - cancelledReason
      - confirmedAt
      - cancelledAt
      - createdAt
      - updatedAt
      - items
    OrderStatusEntry:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BigIntId'
        orderId:
          $ref: '#/components/schemas/Uuid'
        fromStatus:
          type: string
          enum:
          - PENDING_PAYMENT
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - null
          nullable: true
        toStatus:
          $ref: '#/components/schemas/OrderStatus'
        actorId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - orderId
      - fromStatus
      - toStatus
      - actorId
      - reason
      - createdAt
      additionalProperties: false
    OrderDetails:
      allOf:
      - $ref: '#/components/schemas/Order'
      - type: object
        properties:
          statusHistory:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatusEntry'
        required:
        - statusHistory
    MockPaymentRequest:
      type: object
      properties:
        transactionRef:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        method:
          type: string
          enum:
          - MOCK_CARD
          - MOCK_EWALLET
        approved:
          type: boolean
      required:
      - transactionRef
      - method
      - approved
      additionalProperties: false
    MockPaymentResult:
      type: object
      properties:
        transactionRef:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        duplicate:
          type: boolean
