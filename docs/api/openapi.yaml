  /orders/{orderId}/cancel:
    parameters:
    - name: orderId
      in: path
      required: true
      description: UUID hợp lệ; trả 404 nếu không tồn tại hoặc thuộc khách khác.
      schema:
        $ref: '#/components/schemas/Uuid'
    post:
      tags:
      - Orders
      operationId: cancelMyOrder
      summary: Hủy đơn chưa thanh toán
      description: 'CẬP NHẬT NHÓM 09/10: Auth phải xác nhận tài khoản được phép hoạt động và đã hoàn tất đổi mật khẩu
        lần đầu. Token chỉ dành cho đổi mật khẩu chưa được truy cập route này (403 PASSWORD_CHANGE_REQUIRED); tài khoản
        không hoạt động trả 403 ACCOUNT_INACTIVE. Guard phía server kiểm tra trước truy vấn nghiệp vụ; frontend redirect
        không thay thế guard. Các mã lỗi và tên thuộc tính auth context là đề xuất tích hợp, chưa có trong source ZIP.
        CUSTOMER và chủ đơn. Khóa order, kiểm tra trạng thái dưới khóa. PENDING_PAYMENT chưa hết hạn: chuyển HOLDING
        -> RELEASED, giảm reservedStock, đặt CANCELLED; PENDING_PAYMENT đã hết hạn: thực hiện expire cùng transaction
        (EXPIRED, reason RESERVATION_EXPIRED), trả 200 đơn CANCELLED. Pending payments được đánh FAILED với lý do tương
        ứng, callbackCount không đổi. Đơn CANCELLED gọi lại trả 200 bản hiện tại, không ghi lại lý do/lịch sử/giải phóng
        lần hai. CONFIRMED/SHIPPING/DELIVERED trả 409 INVALID_ORDER_STATE. reason tối đa 255 ký tự, bỏ qua dùng CUSTOMER_CANCELLED.
        Chi tiết khóa/audit trong stock-reservation-contract.md.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            examples:
              defaultReason:
                value: {}
              customReason:
                value:
                  reason: Khách đổi ý
