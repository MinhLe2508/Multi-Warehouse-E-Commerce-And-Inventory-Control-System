  /payments/mock/callback:
    post:
      tags:
      - Payments
      operationId: processMockPaymentCallback
      summary: Nhận kết quả từ mock gateway tin cậy
      description: 'Chỉ local/test và backend mock gateway, KHÔNG phải endpoint cho browser khách tự báo đã trả tiền.
        Đề xuất X-Mock-Callback-Token so với secret riêng MOCK_PAYMENT_CALLBACK_SECRET, chưa có trong source/env; không
        dùng JWT_SECRET, không nhúng vào frontend. Thiếu/sai token trả 401. Đối chiếu ref/orderId/amount/currency. Khóa
        theo contract nội bộ. Callback giống hệt một callback đã chấp nhận: 200 duplicate=true, kể cả thời hạn giữ chỗ
        đã qua; chỉ tăng callbackCount, không lặp nghiệp vụ. Mâu thuẫn terminal callback trả 409 CALLBACK_CONFLICT. Callback
        lần đầu cho đơn đã hủy/hết hạn trả 409; không phục hồi reservation. SUCCESS hợp lệ commit giữ chỗ và xác nhận
        đơn; FAILED hợp lệ giữ đơn PENDING_PAYMENT, reservation HOLDING đến hạn gốc để khách thử lại. SUCCESS có failureReason
        trả 400. FAILED bỏ failureReason được chuẩn hóa MOCK_DECLINED. Payment bị FAILED bởi cleanup/cancel không được
        coi là callback gateway đã chấp nhận. Hết hạn dùng clock_timestamp() thực tế sau khi lấy khóa, không chỉ NOW()
        đầu transaction.'
      security:
      - mockCallbackToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentCallbackRequest'
            examples:
              success:
                value:
                  transactionRef: MOCK-DEMO-001
                  orderId: 22222222-2222-4222-8222-222222222222
                  amount: '285000.00'
                  currency: VND
                  status: SUCCESS
              failed:
                value:
                  transactionRef: MOCK-DEMO-001
                  orderId: 22222222-2222-4222-8222-222222222222
                  amount: '285000.00'
                  currency: VND
                  status: FAILED
                  failureReason: MOCK_DECLINED
      responses:
        '200':
          description: Đã chấp nhận hoặc đã xử lý cùng callback trước đó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackResult'
