  /payments:
    post:
      tags:
      - Payments
      operationId: createMockPayment
      summary: Tạo hoặc lấy giao dịch mock đang chờ
      description: 'CẬP NHẬT NHÓM 09/10: Auth phải xác nhận tài khoản được phép hoạt động và đã hoàn tất đổi mật khẩu
        lần đầu. Token chỉ dành cho đổi mật khẩu chưa được truy cập route này (403 PASSWORD_CHANGE_REQUIRED); tài khoản
        không hoạt động trả 403 ACCOUNT_INACTIVE. Guard phía server kiểm tra trước truy vấn nghiệp vụ; frontend redirect
        không thay thế guard. Các mã lỗi và tên thuộc tính auth context là đề xuất tích hợp, chưa có trong source ZIP.
        CUSTOMER và chủ đơn. COD trả 422 UNSUPPORTED_PAYMENT_METHOD (đề xuất phạm vi 0.1). Khóa order; cần PENDING_PAYMENT,
        reservation HOLDING còn hạn và grandTotal > 0. Cùng order đã có PENDING cùng method/amount/currency thì trả 200
        chính payment đó; khác method trả 409 PAYMENT_IN_PROGRESS. Payment trước FAILED có thể tạo giao dịch mới khi
        đơn còn hợp lệ; không gia hạn reservation. Đơn có SUCCESS trả 409 ALREADY_PAID. Sinh transactionRef mới UNIQUE
        tối đa 64 ký tự, amount lấy grandTotal và currency từ order; body không nhận giá. Cùng order bị khóa nối tiếp
        để tránh tạo hai pending payment. 201 cho giao dịch mới, 200 cho tái sử dụng; chưa có cơ chế này trong code nền.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              mockCard:
                value:
                  orderId: 22222222-2222-4222-8222-222222222222
                  method: MOCK_CARD
              mockWallet:
                value:
                  orderId: 22222222-2222-4222-8222-222222222222
                  method: MOCK_EWALLET
      responses:
        '201':
          description: Giao dịch mới, chưa xác nhận thanh toán.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                pending:
                  value:
                    id: 55555555-5555-4555-8555-555555555555
                    orderId: 22222222-2222-4222-8222-222222222222
                    transactionRef: MOCK-DEMO-001
                    amount: '285000.00'
                    currency: VND
                    method: MOCK_CARD
                    status: PENDING
                    failureReason: null
                    callbackCount: 0
                    processedAt: null
                    createdAt: '2026-10-09T03:01:00Z'
                    updatedAt: '2026-10-09T03:01:00Z'
        '200':
          description: Tái sử dụng giao dịch PENDING phù hợp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
