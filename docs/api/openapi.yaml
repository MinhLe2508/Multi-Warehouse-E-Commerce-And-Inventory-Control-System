                  value:
                    statusCode: 409
                    code: PRODUCT_UNAVAILABLE
                    message: Sản phẩm không còn được bán.
                INSUFFICIENT_STOCK:
                  value:
                    statusCode: 409
                    code: INSUFFICIENT_STOCK
                    message: Sản phẩm không đủ số lượng khả dụng.
                RESERVATION_EXPIRED:
                  value:
                    statusCode: 409
                    code: RESERVATION_EXPIRED
                    message: Thời gian giữ chỗ đã hết.
