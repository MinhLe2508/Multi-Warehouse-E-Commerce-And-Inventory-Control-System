x-open-questions:
  - id: Q01
    question: >
      Schema chua co field/bang mapping WAREHOUSE_STAFF vs warehouseId phu trach.
      Can them field warehouseId vao users hoac bang staff_warehouse_assignments.
      De xuat Khang them migration.
    affects: [adminListOrders, adminGetOrder, adminUpdateOrderStatus, adminListInventory, adminRestockInventory, adminListAlerts, adminResolveAlert]
  - id: Q02
    question: >
      OrderStatusHistory chua co model trong schema.prisma (tuan 1).
      adminGetOrder tra statusHistory - can Khang xac nhan hoac them model.
    affects: [adminGetOrder]
  - id: Q03
    question: >
      adminRestockInventory de xuat tu dong resolve StockAlert OPEN neu availableStock vuot threshold sau restock.
      Nhom can chot: tu dong hay de nhan vien tu resolve thu cong?
    affects: [adminRestockInventory, adminResolveAlert]
  - id: Q04
    question: >
      Revenue tinh theo createdAt hay confirmedAt cua don?
      De xuat 0.1 dung createdAt cho don gian.
    affects: [adminGetRevenueReport, adminGetAnalyticsOverview]

